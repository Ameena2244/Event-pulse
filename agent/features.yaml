# Amazon Bedrock AgentCore features for EventPulse.
# Neither Memory nor Gateway is needed for this agent; Runtime alone is sufficient.

memory:
  enabled: false
  name: agentmemory
  strategies: [SEMANTIC, USER_PREFERENCE]
  expiry_days: 30

gateway:
  enabled: false
  name: tools
  authorizer: AWS_IAM
  targets:
    - name: websearch
      type: connector
      connector: web-search
